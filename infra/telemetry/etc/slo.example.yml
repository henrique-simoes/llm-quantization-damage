# SLO classes evaluated per request by llm-proxy (plan §3.1). Host-specific targets, not MLPerf.
# A request counts toward llm_slo_evaluated_total{slo} and, if every clause holds jointly,
# llm_slo_good_total{slo}.
#
# clause:  value(metric) <= le + per_token.seconds * value(per_token.metric)
# metrics: ttft_seconds, ttfat_seconds, queue_wait_seconds, prefill_seconds, tpot_seconds,
#          e2e_seconds, prefill_tokens, input_tokens, output_tokens
#
# Missing inputs: the plan does not define a clause as satisfied when its input is absent, so a
# 2xx request missing ANY clause input (e.g. TPOT when predicted_n < 2, no timings) is NOT
# evaluated. Server-side failures (5xx, upstream connect/timeout/disconnect, in-stream error)
# are evaluated and not good. 4xx and client aborts are not evaluated.
slos:
  - name: interactive
    clauses:
      - { metric: ttft_seconds, le: 8 }
      - { metric: tpot_seconds, le: 0.075 }

  - name: depth_normalised
    clauses:
      - { metric: queue_wait_seconds, le: 2 }
      - { metric: prefill_seconds, le: 2, per_token: { metric: prefill_tokens, seconds: 0.0025 } }
      - { metric: tpot_seconds, le: 0.100 }
