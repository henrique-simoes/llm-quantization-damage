      the five rows whose `instance_in_this_study` column is non-empty with their text. Annotate:
      "with 3 discordant pairs the smallest obtainable p is 0.25; with 5 it is 0.0625; six of this
      study's eleven paired comparisons sit in the shaded region". Caption to render: "The smallest
      two-sided exact McNemar p-value obtainable as a function of the discordant count, with this
      study's own paired comparisons marked. Below six discordant pairs no outcome can reach p < 0.05.
      Before reporting a null for paired binary data, state the smallest effect the test could have
      detected — which is set by the discordant count, not by the sample size."

