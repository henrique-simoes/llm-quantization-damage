      "all nine divergence separations pass Holm; every HellaSwag and HumanEval+ test fails, and could
      not have passed at any outcome" and, on the draft-depth row, "fails Holm once its pair count is
      corrected (10 of 11 adjacent pairs, p = 0.0059 against a 0.0056 threshold); it passes
