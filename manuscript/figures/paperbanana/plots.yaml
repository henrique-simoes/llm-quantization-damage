  - id: F23
    data: ../data/fig23-generation-saturation.csv
    intent: |-
      Two panels. Panel (a): scatter. X axis: `ladder_distance_steps` as three categories 1, 2, 3,
      labelled "distance between the two arms on the quantization ladder (steps)". Y axis:
      `normalised_edit_distance`, linear, 0 to 1, labelled "normalised edit distance between
      generations". One point per row (18 points), coloured by `pair`, with a dashed horizontal line
      at the pooled mean. Panel (b): strip plot of `first_divergence_char`, LOG x axis 1 to 2,000,
      labelled "character at which the two generations first differ", with a vertical band marking
      the completion lengths (1,093–1,918 characters) labelled "full completion length". Annotate
      panel (a): "the two arms ADJACENT on the ladder measure further apart (mean 0.739) than the two
      EXTREMES (0.731)" and "the reference arm opens '- Files scanned: 1000' while all three other
      arms open '- Total files: 1000'". Caption to render: "Pairwise distance between free-running
      greedy generations from a fixed prompt, four arms, three prompts, 512 tokens each, ctx 8,192,
      no speculation, on an engine verified byte-reproducible beforehand. Estimator: character-level
      Levenshtein distance divided by the longer string. Every pair saturates in the 0.39–0.82 band
      and the ordering does not track ladder distance: a negative methodological result showing that
      divergence must be measured on distributions at fixed context, not on emitted trajectories."

