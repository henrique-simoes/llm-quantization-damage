# PaperBanana plot-batch manifest — statistical plots for
# "Divergence Ranks What Benchmarks Bound".
#
#   paperbanana plot-batch --manifest manuscript/figures/paperbanana/plots.yaml \
#       --venue multivac --iterations 3 --optimize --format png \
#       --output-dir manuscript/figures/rendered
#
# Paths are resolved relative to THIS file's directory (README, `plot-batch`).
# Full specifications, captions, alt text and honesty constraints: ../FIGURE-PROGRAMME.md
# House style (palette, markers, greyscale rule, the seven non-negotiable rules) is NOT repeated in
# every intent: it lives in the venue pack at ./venue-multivac/ — copy it to
# ~/.config/paperbanana/venues/multivac and pass --venue multivac. See ../RENDERING.md §4.4.
# Each intent below carries only what is specific to that figure, including its honesty constraints
# and the caption to render verbatim.

items:

  - id: F1
    data: ../data/fig01-divergence-ladder.csv
    intent: |-
      Publication figure for an arXiv systems paper. Dot plot with horizontal error bars — NOT a bar
      chart, because a divergence has no zero baseline. X axis: mean KL divergence in nats, LOG
      scale, about 0.002 to 0.05, labelled "mean KL divergence vs UD-Q6_K_XL reference (nats)". Y
      axis: categorical, one row per CSV row, grouped into three blocks by `arm` (UD-Q6_K, then
      UD-Q5_K_XL, then UD-Q4_K_XL), and inside each block one row per `domain` in the order
      wikitext2, code, humaneval, labelled with `domain_label`. Insert visible whitespace between
      blocks. Put the final row — the KV-only control — below all three blocks, visually detached.
      Each point carries a symmetric horizontal bar of ±`mean_kld_se_nats`; at this scale most bars
      are smaller than their markers, which is the point of the figure: DO NOT rescale, jitter or
      enlarge them. Marker fill encodes domain: open circle for prose, filled square for code,
      half-filled diamond for task prompts. Colour encodes arm: UD-Q6_K #0072B2, UD-Q5_K_XL #009E73,
      UD-Q4_K_XL #D55E00, the control #CC79A7. Two shaded vertical reference bands behind the data:
      0 to 0.007 labelled "Fireworks: high-quality deployment threshold (external)", and 0.01 to 0.03
      labelled "LocalBench: observed Q4_K_M range (external, disclaimed by its source)". Annotate the
      three humaneval rows with a bracket reading "no arm passes the external threshold on the actual
      task distribution". Label the control row "q4_0 vs f16 KV cache, reference weights". Note on
      the axis: "reference arm UD-Q6_K_XL is 0 by construction". Colour must never be the only
      distinction; the figure must survive greyscale. White background, no gradients, no 3-D.
      Caption to render: "Mean KL divergence against the UD-Q6_K_XL reference, by arm and evaluation
      domain. Bars are ±1 standard error as emitted by llama-perplexity --kl-divergence. n = 65,536
      tokens per cell for prose and code, 18,432 for HumanEval+ prompts. Protocol: SSA divergence,
      n_ctx 2,048, q4_0 KV, seed 20260830. The bottom row is a control in which the weights are not
      quantized and only the KV cache dtype changes. Shaded bands are external reference points, not
      this study's criteria. Divergence is ladder-relative: no FP16 reference fits this host."

  - id: F1b
    data: ../data/fig01b-adjacent-separation.csv
    intent: |-
      Small companion plot. Horizontal lollipop chart. X axis: `sigma`, linear, 0 to 13, labelled
      "separation between adjacent arms (combined standard errors)". Y axis: six rows, one per CSV
      row, labelled "<domain_label>: <arm_a> → <arm_b>", grouped by domain. Vertical reference lines
      at 1.96 (dashed, "z = 1.96") and 3.02 (solid grey, "Bonferroni z at m = 19"). Colour by domain:
      prose #0072B2, code #D55E00, task prompts #009E73; also vary marker shape. Annotate the
      smallest bar: "the study's most fragile separation". Greyscale-safe, white background.
      Caption: "Adjacent-arm separation in units of the combined standard error, by domain. Every
      adjacent pair has disjoint ±1 SE intervals in every domain; the range 3.7–11.8 σ quoted in the
      paper is the minimum and maximum of these six values. n = 65,536 tokens per cell (18,432 for
      task prompts)."

  - id: F2
    data: ../data/fig02-tail-amplification.csv
    intent: |-
      Two-panel figure, panels stacked vertically, sharing a categorical x axis. Filter the CSV on
      the `panel` column. Panel (a), rows where panel = a: x axis is the `quantile` column as evenly
      spaced categories in the order median, p90, p95, p99, p99.9 (EXCLUDE the mean and max rows from
      the x axis — the mean values are drawn as annotations, see below). Y axis: `ratio`, LOG scale,
      about 0.003 to 20, labelled "code ÷ prose per-token KL divergence". One connected line per
      `series` (UD-Q6_K #0072B2 circle solid, UD-Q5_K_XL #009E73 square dashed, UD-Q4_K_XL #D55E00
      triangle dash-dot). A heavy grey horizontal line at y = 1 labelled inline at the right "code
      and prose equally perturbed"; shade below it faintly and label once at the left "code less
      perturbed than prose". CRITICAL: at the median tick, do NOT draw three separate points. Draw a
      single shaded band spanning the three arms' values with the annotation "median ≈ 0.005×, about
      200× less than prose; print precision here is ±3–7 % and the arms' intervals overlap — this
      column cannot rank them". Add three small open markers with short leader lines between the p95
      and p99 ticks at y = 1.755, 2.304 and 2.623 (the mean rows in the CSV), labelled once "mean —
      the commonly quoted figure sits out in the tail". Draw a vertical dashed rule between the p90
      and p95 ticks labelled "crossover". Panel (b), rows where panel = b: same x categories, y axis
      `ratio` = quantile ÷ that cell's own mean, LOG scale, labelled "quantile ÷ own mean". Draw the
      three code series as solid lines, the series named "KV-only control (no weight quantization)"
      as a dotted #CC79A7 line with diamond markers, and the three prose series as a single grey
      min–max band labelled "prose cells, all three arms". Annotate: "p99/mean ≈ 24–26 for quantized
      weights, 22.9 for the KV-only control" and "prose 8.4–8.6". Colour-blind safe, greyscale-legible,
      white background, no 3-D. Caption to render: "Where quantization damage lives. (a) Code-to-prose
      amplification of per-token KL divergence by quantile, three arms, reference UD-Q6_K_XL,
      n = 65,536 tokens per cell; the ordering reverses between the 90th and 95th percentile and the
      commonly quoted mean is the average of two opposite facts. The median column is drawn as a band
      because the tool prints six decimals and the arms cannot be ranked there. (b) The same
      distributions normalised by their own mean: the code cells and a control with no weight
      quantization share a tail shape, while prose is flat across the ladder. Quantiles carry no
      interval — the tool attaches uncertainty to the mean only."

  - id: F3
    data: ../data/fig03-instrument-bounds.csv
    intent: |-
      Forest plot. X axis: `effect`, linear, symmetric about zero, roughly −30 to +20, labelled
      "paired difference, cheaper arm − reference (points)". Heavy vertical line at 0. Y axis:
      categorical, one row per CSV row in file order, grouped by `instrument` family with a light
      horizontal rule between families. Draw the point estimate with a 95 % interval bar from
      `ci95_lo` to `ci95_hi`. Rows whose interval columns are empty (SWE-bench, perplexity) get an
      OPEN marker and NO bar, labelled "unpaired — no paired estimator available". Marker size in
      three discrete steps by `n`. To the right of the panel add a text column per row showing
      `discordant` and `min_attainable_p`; give every row whose min_attainable_p exceeds 0.05 a light
      grey background stripe and the tag "could not have reached p < 0.05". Grey out and strike
      through the row whose verdict mentions PN-60, with a callout "as published: −10.0 pts,
      p = 0.002. Re-analysis: every failure is a truncation; the retrieval claim is withdrawn". Put a
      boxed note in a corner: "Divergence, on the same arms, separates every pair with non-overlapping
      intervals at 3.7–11.8 σ." Colour by instrument family, but also vary marker shape; greyscale
      must remain readable. Caption to render: "Paired differences between the cheaper arm and the
      reference with 95 % intervals across every task instrument. Estimator: difference in paired
      proportions with the Wald interval; exact conditional McNemar p-values are given beside the
      smallest p the test could have returned at its discordant count. Six of the eleven paired
      comparisons could not have reached p < 0.05 at any outcome. HellaSwag n = 400; HumanEval+
      n = 164; RULER n = 12–100; SWE-bench Verified n ≈ 50 with unequal denominators; WikiText-2
      perplexity Protocol 1, n = 602 windows."

  - id: F4
    data: ../data/fig04-ceiling-matrix.csv
    intent: |-
      Categorical matrix (heatmap-style grid), 4 rows × 7 columns, plus a scatter inset. Rows: `arm`
      in the order UD-Q6_K_XL, UD-Q6_K, UD-Q5_K_XL, UD-Q4_K_XL, each annotated on the right with its
      `ctx_requested_tokens` (212,992 / 262,144 / 262,144 / 262,144). Columns: `tensor_split` in the
      order default, 52,48, 54,46, 56,44, 58,42, 60,40, 62,38. Cell appearance is driven by `status`:
      "loaded" = solid fill with `decode_tok_s` printed inside in a small font; "failed" = diagonal
      hatch on grey with the short failure label "oom"; "not_tested" = empty with a light outline.
      Use fill and hatch, NEVER red/green, so the figure survives greyscale and colour-blind viewing.
      Add a bracket over the `default` column: "the engine default fails at this rung for two of the
      three arms tried there, and was never attempted for UD-Q6_K_XL". Annotate the UD-Q4_K_XL row
      "counter-example: loads at the default split" and the UD-Q6_K_XL row "one feasible ratio, with
      failures on both sides". Footer strip: "every failure shown is a single attempt except
      UD-Q6_K_XL at 229,376". Caption to render: "Load success and decode throughput across
      tensor-split ratios, each arm at the context where its ratio sweep ran. -sm layer, q4_0 KV,
      MTP draft depth 2, -fit off, -ctxcp 4, official non-thinking sampling; each cell is one launch
      and every successful cell reached ≥ 0.9469 of its window before decoding. Failure classes are
      read from the preserved server log. Single attempts: the failures are demonstrated once each,
      not bracketed."

  - id: F4-inset
    data: ../data/fig12b-speed-groups.csv
    intent: |-
      Small scatter plot to be placed as an inset in Figure 4. Filter to rows where `arm` is
      UD-Q5_K_XL and `ctx_tokens` is 262144. X axis: VRAM imbalance in MiB, 0 to 1,800 — take the
      values 742, 166, 28, 1176, 1750 for tensor splits 54,46 / 56,44 / 58,42 / 60,40 / 62,38
      respectively (they are in ../data/fig04-ceiling-matrix.csv, column imbalance_mib). Y axis:
      `median_tok_s` where n_reps ≥ 1, 8 to 13.5, labelled "decode at full window (tok/s)". Label
      each point with its tensor split. DO NOT draw a trend line — the relationship is not monotone
      and implying one would be wrong. Annotate the 58,42 point: "most balanced (28 MiB) and slowest
      (8.50 tok/s); the other four cluster within 3.6 %, inside a 40.7 % within-configuration noise
      floor". Caption: "Decode throughput against per-GPU VRAM imbalance for UD-Q5_K_XL's five loading
      ratios at 262,144 tokens; single readings except 54,46 and 56,44 (median of 3)."

  - id: F5
    data: ../data/fig05-speculation.csv
    intent: |-
      Two-panel bar chart, panels side by side, same four categories in the same order from the
      `config` column: no-spec, MTP n=2, MTP n=4, DFlash2 n=4. Left panel: y axis
      `decode_tok_s_median`, linear 0 to 60, labelled "decode throughput at ctx 32,768 (tok/s),
      median over 164 generations"; label each bar above with `speedup_vs_nospec` formatted like
      "2.03×". Right panel: y axis `byte_exact_pct`, linear 0 to 105, labelled "byte-exact
      reproduction of the unspeculated baseline (%)", with a horizontal reference line at 100 %;
      print `byte_exact_vs_baseline_n`/`n_problems` inside or above each bar as "131/164". Use a
      different fill texture in the right panel so the two quantities are not read as one. Hatch the
      DFlash2 bar in the right panel and label it "engine-confounded — different engine build".
      Callout on the right panel's no-spec bar: "self-repeat control: the same configuration re-run a
      day later reproduced all 164 completions byte-for-byte". Footnote strip under both panels:
      "pass@1 moves 91.5 → 90.2 → 90.9 → 90.2 on HumanEval+, far inside ±4.6 points at n = 164 — this
      figure is not a ranking of accuracy". Colour-blind safe; greyscale must remain readable.
      Caption to render: "Decode throughput and byte-exact reproduction of the unspeculated baseline,
      164 HumanEval+ problems, UD-Q6_K at ctx 32,768, -ts 58,42, -ctxcp 32, q4_0 KV, greedy
      (temperature 0, top_p 1, seed 20260830). The no-spec bar in the right panel is a self-repeat
      control run a day later. The DFlash2 bar is hatched because that arm ran on a different engine
      build, so an engine-version difference is inseparable from the speculation effect."

  - id: F6
    data: ../data/fig06-two-instruments.csv
    intent: |-
      Two panels stacked vertically sharing a categorical x axis of the four arms in ladder order
      UD-Q6_K_XL, UD-Q6_K, UD-Q5_K_XL, UD-Q4_K_XL, with x tick labels drawn only under the lower
      panel; heights roughly 55 % / 45 %. Filter on the `panel` column. Upper panel (panel = upper):
      y axis "accuracy (%)", linear, 74 to 103; three series distinguished by `instrument`, each with
      vertical error bars from `ci_lo` to `ci_hi`; distinguish series by marker shape AND colour; a
      compact in-panel legend. Some series cover only two of the four arms — do not interpolate a
      line across the missing arms. Add a horizontal bracket between the two HumanEval+ points
      labelled "paired 95 % CI on the difference: −3.28 to +2.06 points (n = 164)". Annotate the
      RULER points "both arms at ceiling; the interval bounds almost nothing at n = 12". Lower panel
      (panel = lower): y axis "mean KL divergence, code (nats)", LOG scale; three points with ±1 SE
      connected by a line, plus an open marker on the axis at UD-Q6_K_XL annotated "reference: 0 by
      construction". Annotate "adjacent arms separated at 3.7–11.8 σ". DO NOT use a twin or shared y
      axis across the panels. Caption to render: "Task-benchmark scores (upper) and code-domain KL
      divergence (lower) for the same four arms. Upper: Wilson 95 % intervals; the bracket is the
      Wald interval on the paired per-problem difference. HellaSwag n = 400; HumanEval+ n = 164,
      official non-thinking preset, no speculation; RULER S-NIAH n = 12 at 131,072 tokens. Lower: ±1
      SE, n = 65,536 tokens per cell. The panels use different y-scales and are not comparable in
      magnitude."

  - id: F7
    data: ../data/fig07-tail-shape.csv
    intent: |-
      Grouped dot plot. X axis: ratio of a quantile to that cell's own mean, LOG scale, about 0.0005
      to 1000, labelled "quantile ÷ own mean". Y axis: categorical, ten rows (one per CSV row),
      grouped into three blocks by `corpus` in the order prose, code, task prompts, with whitespace
      between blocks; label each row with its `arm`. For each row plot five points from the columns
      median_over_mean, p90_over_mean, p95_over_mean, p99_over_mean, p999_over_mean, joined by a thin
      line; encode which statistic each point is by marker shape with a shared legend. DO NOT plot
      max_over_mean — it swings over three orders of magnitude and would dominate the axis. Draw
      light vertical guides at the block-typical p99/mean values with labels "prose ≈ 8.5",
      "code ≈ 24–26", "task prompts ≈ 17–18". Label the row whose `perturbation` is
      kv_dtype_q4_0_vs_f16 as "no weight quantization — q4_0 vs f16 KV only, p99/mean = 22.9" and
      give it the #CC79A7 colour and a dotted connector. Boxed note: "within a corpus the shape is
      flat across a 7× range of mean divergence". Caption to render: "Divergence distributions
      normalised by their own mean, all ten measured cells. Within each corpus the shape is nearly
      invariant across the quantization ladder while the three corpora differ by roughly a factor of
      three at the 99th percentile. The code block includes a control with no weight quantization.
      n = 65,536 tokens per cell (18,432 for task prompts). Quantiles carry no interval."

  - id: F8
    data: ../data/fig08-metric-pair.csv
    intent: |-
      Scatter plot. X axis: `mean_kld_nats`, LOG scale, 0.002 to 0.05, labelled "mean KL divergence
      (nats)". Y axis: `top1_agreement_pct`, linear, 95.5 to 99.6, labelled "top-1 token agreement
      with the reference (%)". One point per row; colour by `arm`, marker fill by `domain` (open =
      prose, filled = code, half-filled = task prompts). Join the cells belonging to one arm with a
      thin line so the per-arm trajectory across domains is visible. Shade the upper-right region
      faintly and label it "higher agreement AND higher divergence — the region a single-metric table
      cannot describe". Draw an arrow from the prose cluster to the code cluster labelled "→ code:
      agreement +1.6 to +2.2 pts, divergence ×1.75 to ×2.62". Add a note: "the code corpus is far
      more predictable (reference PPL 1.18 vs 5.79), so the argmax usually survives while the
      distribution around it moves". Mark the task-prompt points as smaller n. Caption to render:
      "Top-1 token agreement against mean KL divergence for every measured cell. Points to the upper
      right have higher agreement and higher divergence at once: on code every arm agrees with the
      reference on more tokens than on prose while diverging roughly twice as far. n = 65,536 tokens
      per cell (18,432 for task prompts). The mechanism is an interpretation consistent with the
      perplexity gap, not a controlled test."

  - id: F9
    data: ../data/fig09-ruler-closure.csv
    intent: |-
      Horizontal stacked bar chart, one bar per CSV row (14 bars), grouped by `task` with whitespace
      between groups; label each bar "<arm> · <context_tokens> tokens". X axis: number of items, 0 to
      `n_samples`, labelled "items"; print n at the end of each bar. Segments left to right, computed
      from the columns: (1) closed AND correct = items_closed_think_block − closed_and_wrong, solid;
      (2) correct without closing = correct_without_closing, light fill; (3) closed and wrong =
      closed_and_wrong, dark fill — this is ZERO in every row and that is the point of the figure, so
      keep it in the legend and annotate "closed and wrong: 0 in all fourteen cells"; (4) the
      remainder = not closed and wrong, diagonal hatch on grey. Bracket the three single-needle rows
      spanning 8,192 / 32,768 / 131,072: "100 % correct AND 100 % closed in both arms — a genuine
      ceiling, not a degenerate string match". Annotate the variable_tracking rows "excluded from the
      study's comparison; 0 of 25 items fully correct in either arm, 0 closures" and the mkmock rows
      "passes entirely from output that never finished reasoning (n = 3)". Colour-blind safe,
      greyscale-legible. Caption to render: "RULER outcomes decomposed by whether the model closed its
      reasoning block, all fourteen committed cells. Scored with RULER's own string_match_all — which
      reproduces every published cell score exactly — and classified by the presence of </think>.
      Greedy with reasoning enabled and n_predict 128: a sampling configuration used nowhere else in
      the study. Nowhere in this battery did the model finish reasoning and answer wrongly."

  - id: F9b
    data: ../data/fig09b-ruler-mk100-paired.csv
    intent: |-
      Three small 2×2 contingency panels side by side, one per CSV row, to be placed beside Figure 9.
      Each panel is a labelled quadrant block: rows "reference correct / incorrect", columns "cheaper
      arm correct / incorrect", cells filled with `both`, `reference_only`, `cheaper_arm_only`,
      `neither`. Title each panel with its `comparison`. Beneath each panel print the exact McNemar p
      and the paired difference with its 95 % interval, e.g. "−10.00 pts [−15.88, −4.12], exact
      p = 0.0020". Shade cell backgrounds by count. Annotate the middle panel "same length, same
      arms, same 128-token budget — only task difficulty differs" and the third "on the items where
      neither arm's budget bound, the arms are identical". Caption to render: "Paired analysis of the
      100-sample RULER multi-key cell at 131,072 tokens. The published retrieval separation coincides
      with a reasoning-block closure separation; restricted to the 55 items where neither arm's output
      budget bound, the arms are identical item for item. n = 100 paired items (55 in the restricted
      panel); estimator: exact conditional McNemar and the Wald paired difference."

  - id: F10
    data: ../data/fig10-protocol-swing.csv
    intent: |-
      Waterfall / step chart. Use the first three rows (the three `step` values that are not "GGUF
      ladder reference") as three ordered x positions, left to right in file order. Y axis:
      `perplexity`, linear, 6.4 to 8.8, labelled "WikiText-2 perplexity (same NVFP4 weights)". Draw
      the three values as steps connected by descending connectors. Behind them draw a horizontal
      shaded band spanning the four "GGUF ladder reference" rows (6.6511 to 6.6839) labelled "the
      GGUF ladder on the same windows". Annotate each step with
      `apparent_degradation_vs_Q6_K_XL_pct` as "+29.1 %", "+21.4 %", "+0.8 %". Add a bracket spanning
      the first and last step: "36× swing in the estimated effect, same weights". Add a note under
      the middle step: "two conventions changed together — corpus file and window coverage. They were
      not varied one at a time, so this step is not decomposable." Add a footnote: "a fourth suspected
      axis, tokenizer mismatch, was investigated and disproven: the two tokenizations agree exactly
      on both files." Mark the figure "pre-2026-08-29 · irreproducible-on-current-images".
      Caption to render: "One checkpoint, one benchmark corpus, three measurement conventions. The
      vLLM NVFP4 arm was first scored at 8.5848 against a GGUF ladder at 6.65–6.68; re-scored on the
      ladder's exact 602 windows with its half-window rule the same weights return 6.7073. The
      intermediate point changes corpus file and coverage together and is not a single-axis
      decomposition. Protocol 1 throughout the band. Measured 2026-08-28."

  - id: F11
    data: ../data/fig11-vram-asymmetry.csv
    intent: |-
      Paired horizontal bar chart ("tornado" layout). Filter to the ceiling-relevant rows: for each
      `arm`, keep the rows at its largest `ctx_requested_tokens` plus, for UD-Q6_K_XL, the 196,608
      rows — about 20 rows; drop repetitions beyond rep 1. Y axis: categorical, grouped by arm,
      labelled "<arm> · <ctx> · -ts <tensor_split>". X axis: peak VRAM per card in MiB, 0 to 16,500,
      drawn as two bars per row from a shared centre line — `vram_peak_gpu0_mib` growing left,
      `vram_peak_gpu1_mib` growing right. Draw a vertical rule at 16,311 MiB on both sides labelled
      "card capacity" and a dashed rule at 15,650 labelled "highest stable observation". Hatch the
      rows where `ok` is false. Annotate the row with the largest `stranded_on_lighter_card_mib`:
      "2,978 MiB stranded on the lighter card — physically present, unreachable"; annotate the
      UD-Q6_K 58,42 row "rebalanced: the full native window loads". Boxed note: "with -sm layer each
      layer's weights AND its slice of the KV cache live on one card; MTP additionally builds a
      separate draft context against the target model, which is why enabling it costs window."
      Caption to render: "Peak per-GPU memory at each arm's headline context, sampled at 1 Hz and
      taken after a deep prefill (≥ 0.9469 of the window) rather than at load. The two RTX 5060 Ti
      cards have no NVLink, so with layer-wise splitting the binding constraint is the fuller card's
      16,311 MiB, never the 32,622 MiB aggregate. Hatched rows failed to allocate compute buffers.
      Layer-split VRAM carries ±100–200 MiB of run-to-run noise."

  - id: F12
    data: ../data/fig12-decode-acceptance.csv
    intent: |-
      Scatter plot with one fitted line. X axis: `mtp_acceptance`, linear, 0.45 to 0.95, labelled
      "MTP draft acceptance". Y axis: `decode_tok_s`, linear, 8 to 17, labelled "decode throughput at
      depth (tok/s)". Plot every row; rows with `in_regression_set` = true are filled markers, the
      rest open. Colour and marker shape both by `arm`. Draw ONE ordinary-least-squares line fitted
      to the in_regression_set rows only and print inside the panel: "decode = 4.53 + 11.32 ×
      acceptance · r = 0.909 · R² = 0.827 · residual SD 0.68 tok/s vs raw SD 1.57 (n = 17)". Callout
      on the group of points sharing acceptance 0.516: "acceptance is identical across every -ts ratio
      within a repetition index — it is a property of the generated continuation, not of the
      configuration". Label the single lowest point (8.50 tok/s, acceptance 0.516): "the one reading
      that survives conditioning: a genuine ratio effect of about −2.2 tok/s". Footer: "the speed
      probe ran under official sampling (temperature 0.7), which makes the generated text — and
      therefore acceptance — vary between repetitions". Caption to render: "Decode throughput against
      speculative draft acceptance. Estimator: ordinary least squares over the 17 successful cells at
      262,144 tokens and -ctxcp 4 (three arms, five split ratios). All cells: -sm layer, q4_0 KV, MTP
      draft depth 2, official non-thinking sampling, at ≥ 0.948 of the window. The regression is
      observational: acceptance is recorded, not manipulated."

  - id: F12b
    data: ../data/fig12b-speed-groups.csv
    intent: |-
      Dumbbell chart. Filter to rows where `is_true_repetition_group` is true (four rows). Y axis:
      one row per group labelled "<arm> · <ctx_tokens> · -ts <tensor_split> · -ctxcp <ctxcp> · n=3".
      X axis: spread in per cent, linear, 0 to 45, labelled "within-configuration decode spread,
      (max − min) / median". For each row draw two markers joined by a line: `spread_pct_over_median`
      (open marker, "raw") and `acceptance_adjusted_spread_pct_over_median` (filled marker,
      "conditioned on acceptance"); print the reduction beside each pair. Add a vertical dashed line
      at 6.74 labelled "between-arm span at matched depth". Do not include the n = 1 groups. Caption
      to render: "Within-configuration decode spread over true repetition groups — matched on arm,
      context, split ratio and -ctxcp — before and after adjusting each reading to its group's mean
      draft acceptance. Estimator: (max − min)/median, stated once and used throughout; earlier
      published values of 32.9 % and 46.7 % for this quantity used different estimators or mixed
      cells. UD-Q4_K_XL has no repetition group at this context (n = 1) and is absent."

  - id: F13
    data: ../data/fig13-divergence-length.csv
    intent: |-
      Grouped bar chart with an overlaid model line. X axis: `quartile` as four categories, labelled
      with their character ranges from `len_lo_chars`–`len_hi_chars` (≤464, 465–700, 701–989, >989),
      titled "quartile of the no-spec baseline completion length (characters)". Y axis:
      `divergence_rate_pct`, linear, 0 to 70, labelled "completions differing from the unspeculated
