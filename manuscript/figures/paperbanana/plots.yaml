      against DEFF. X axis: design effect, LOG scale, 1 to 100. Y axis: effective σ, LOG scale, 1 to
      20. One line per separation, coloured by domain, labelled at the right. Horizontal rules at 1.96
      ("z = 1.96") and 3.02 ("Bonferroni z at m = 19"); mark where each line crosses the Bonferroni
