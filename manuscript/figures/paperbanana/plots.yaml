      invalidated by the generation gate (55 and 124 tokens of 512)". On one representative cell draw
      two intervals side by side: a thin cap of ±0.02 labelled "pooled over draft events
      (misleading)" and a wide bracket of ±0.3 labelled "between generations (honest)". Panel header:
      "acceptance falls in 10 of 11 adjacent draft-depth pairs (one-sided sign test p = 0.0059); the
      implied per-token match probability is flat to within ±0.19". Caption to render: "Speculative
      draft acceptance against draft depth at two matched context depths (prompt lengths held
